<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lesson PDF reader</title>
  <style>
    * { box-sizing: border-box; }
    html { background: #3c454b; color: white; font: 14px system-ui, sans-serif; }
    body { margin: 0; padding: 8px; }
    #status { padding: 12px; line-height: 1.5; }
    .page { position: relative; width: 100%; margin-bottom: 10px; background: white; color: #52606a; overflow: hidden; }
    .page span { position: absolute; top: 12px; left: 12px; }
    canvas { position: relative; display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="status" role="status">Loading PDF…</div>
  <main id="pages" aria-label="PDF pages"></main>
  <script type="module" src="/static/study-pdf.mjs"></script>
</body>
</html>
